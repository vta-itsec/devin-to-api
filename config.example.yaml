server:
  listen: ":8080"
  # 同时处理的 /v1/* 请求数上限；0 或不填表示使用默认值 1024。
  max_concurrency: 1024

debug:
  enabled: false

devin:
  # ====== 上游后端 ======
  # "connect"（默认）：直连 GetChatMessage RPC，每请求一个新 trajectory ——
  #   无状态，靠客户端重放历史维持多轮。
  # "acp"：spawn `devin acp` 子进程，按消息链前缀把同一对话挂到同一个
  #   devin CLI 会话（session/new + session/load）—— 服务端会话持久，
  #   devin 可在 workspace 内使用自身 fs/exec 工具。需要机器上有 devin CLI。
  # backend: "acp"
  # acp_bin: "devin"                  # devin 可执行文件
  # workspace: "~/.devin-to-api/workspace"  # ACP 会话 cwd + fs 工具范围
  # acp_mode: "bypass"                # 权限模式：bypass/smart/ask/plan/accept-edits
  # acp_state_file: ""                # 对话→会话映射；默认 <workspace>/.devin-to-api-sessions.json

  # 上游 Devin Connect 服务地址；默认 https://server.codeium.com，
  # credentials.toml 中的 api_server_url 也会作为兜底。
  # base_url: "https://server.codeium.com"

  # ====== 认证（三选一）======
  # 1) 推荐：`devin auth login`。无需在此填写任何内容 —— 代理默认按请求实时读取
  #    ~/.local/share/devin/credentials.toml（windsurf_api_key），
  #    登录/登出无需重启。可用 credentials_file 改路径。
  # credentials_file: "~/.local/share/devin/credentials.toml"
  #
  # 2) 环境变量 DEVIN_SESSION_TOKEN="devin-session-token$..."
  #
  # 3) 直接写死 token（不推荐提交到 git）：
  # token: "devin-session-token$..."

  # Devin chat model UID；不填默认 adaptive（上游自动选路）。
  # 客户端请求里的 model 字段始终可以覆盖此值。
  # model: "adaptive"

  # 上游代理地址（可选）；支持 http://、https://、socks5://、socks5h://
  # proxy: "socks5://127.0.0.1:1080"

  # 强制 HTTP/1.1：每请求独立 TCP 连接，避免 HTTP/2 单连接多 stream 复用
  # 被上游串行处理导致并发卡住/首字延迟飙升。默认 true。
  # force_http1: true

dashboard:
  # 管理面板密码；留空则无需登录，直接进入 /panel。
  password: ""

auth:
  # 对外 /v1/* 接口访问密钥（VS Code custom endpoint 的 apiKey 填这个）。
  # 留空则不校验 —— 仅可暴露给可信网络。
  # 也可用环境变量 PROXY_API_KEY 设置。
  api_key: ""

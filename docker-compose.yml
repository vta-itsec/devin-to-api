services:
  devin-to-api:
    build: .
    image: devin-to-api:latest
    ports:
      - "${BIND:-0.0.0.0}:${PORT:-8080}:8080"
    volumes:
      # Shares `devin auth login` state between host and container:
      # log in on either side and the proxy picks the token up live.
      # Requires the dir to exist — run `devin auth login` on the host first
      # (or `mkdir -p ~/.local/share/devin`), otherwise swap this for a named
      # volume and log in inside the container instead.
      - ~/.local/share/devin:/home/devin/.local/share/devin
      # Container-only login alternative (then: docker compose exec devin-to-api devin auth login):
      # - devin-data:/home/devin/.local/share/devin
      # ACP backend workspace: devin's fs/exec tools see this dir, and the
      # conversation→session map persists here. Mount your project code to
      # let sessions read/edit it, e.g. ./workspace:/home/devin/workspace
      - ./workspace:/home/devin/workspace
      # Optional: your own config file instead of docker/config.yaml
      # - ./config.yaml:/etc/devin-to-api/config.yaml:ro
    environment:
      # API key clients must present for /v1/* (VS Code "apiKey" field).
      PROXY_API_KEY: ${PROXY_API_KEY:-}
      # "acp" = persistent devin CLI session per conversation (recommended for
      # VS Code chats); "connect" = stateless upstream call per request.
      DEVIN_BACKEND: ${DEVIN_BACKEND:-acp}
      DEVIN_WORKSPACE: ${DEVIN_WORKSPACE:-/home/devin/workspace}
      # ACP permission mode: bypass/smart/ask/plan/accept-edits
      DEVIN_ACP_MODE: ${DEVIN_ACP_MODE:-bypass}
      # Alternative to the volume above:
      # DEVIN_SESSION_TOKEN: ${DEVIN_SESSION_TOKEN:-}
      # Devin Cloud API key for /v1/sessions* passthrough (api.devin.ai).
      # Leave empty to forward the client's own Bearer token instead.
      DEVIN_API_KEY: ${DEVIN_API_KEY:-}
      # Upstream base URL for /v1/sessions* — set to enable the endpoints even
      # without a server-side key (clients then pass X-Devin-Api-Key).
      DEVIN_CLOUD_BASE_URL: ${DEVIN_CLOUD_BASE_URL:-}
      # Optional default snapshot injected into POST /v1/sessions when the
      # request omits snapshot_id.
      DEVIN_CLOUD_SNAPSHOT_ID: ${DEVIN_CLOUD_SNAPSHOT_ID:-}
    restart: unless-stopped

